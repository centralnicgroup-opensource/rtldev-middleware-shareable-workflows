name: Release
on:
  workflow_call:
    inputs:
      pnpm-version:
        description: >-
          Which pnpm to install. Empty by default, so pnpm/action-setup resolves the
          version from the calling repository's package.json, where
          `devEngines.packageManager` names the range the Node toolchain policy allows.
          Pass an explicit version only to override that, and only from a repository
          whose manifest declares none — the action treats a version here plus a
          declaration there as a hard error. (RSRMID-3008)
        type: string
        required: false
        default: ""

jobs:
  tests:
    uses: ./.github/workflows/java-sdk-test.yml
    secrets: inherit

  release:
    name: Release @ ${{ vars.RTLDEV_MW_CI_OS }}
    runs-on: ${{ vars.RTLDEV_MW_CI_OS }}
    needs: tests
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      deployments: write
      id-token: write # to enable use of OIDC for trusted publishing and npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # JAVA is used for Releasing on MAVEN Central
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ vars.RTLDEV_MW_CI_JAVA_VERSION }}
          distribution: ${{ vars.RTLDEV_MW_CI_JAVA_DISTRO }}
          check-latest: true
          cache: maven
      - name: Maven version
        run: mvn --version
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          version: ${{ inputs.pnpm-version }}
      - name: Setup NodeJS ${{ vars.RTLDEV_MW_CI_NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.RTLDEV_MW_CI_NODE_VERSION }}
          check-latest: true
          cache: pnpm
      - name: Install NodeJS Dependencies
        run: pnpm i --frozen-lockfile
      - uses: actions/download-artifact@v8
        id: download
        with:
          name: coverage-report-${{ vars.RTLDEV_MW_CI_JAVA_VERSION }}
      - run: |
          rm -rf target
          unzip -qq -o target.zip
          rm target.zip
      # @semantic-release/git pushes the release commit straight to the default branch,
      # which no pull request can carry — it happens after the version is decided. The
      # ruleset therefore names DeployKey as its only bypass actor, and this is the key:
      # per-repository, write-enabled, so a leak costs one repository rather than every
      # repository a personal access token can reach.
      #
      # The key goes through env, not through ${{ }} interpolated into the script body:
      # a multi-line value breaks there, and the body is a shell injection surface.
      #
      # Fails on an empty secret rather than letting it through. semantic-release falls
      # back to HTTPS when SSH auth fails and does not re-verify, so an unset secret
      # would surface as a rejected push at the very end of the release, after the
      # version has already been chosen and the tag written.
      - name: Configure SSH for the release push
        env:
          SSH_KEY: ${{ secrets.RTLDEV_MW_CI_SSH_KEY }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::RTLDEV_MW_CI_SSH_KEY is not set — the release push has no identity"
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.RTLDEV_MW_CI_TOKEN }}
          MAVEN_OPTS: ${{ vars.MAVEN_OPTS }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ENCRYPTED_C9F9AEDF26B7_KEY: ${{ secrets.ENCRYPTED_C9F9AEDF26B7_KEY }}
          ENCRYPTED_C9F9AEDF26B7_IV: ${{ secrets.ENCRYPTED_C9F9AEDF26B7_IV }}
          GPG_KEY_NAME: ${{ secrets.GPG_KEY_NAME }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          TEAMS_NOTIFICATION_URI: ${{ secrets.RTLDEV_MW_CI_NOTIFICATION_URI }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          openssl aes-256-cbc -K "$ENCRYPTED_C9F9AEDF26B7_KEY" -iv "$ENCRYPTED_C9F9AEDF26B7_IV" -in codesigning.asc.enc -out codesigning.asc -d
          gpg --import --batch codesigning.asc
          pnpm exec semantic-release
