name: Linting & Coverage
on:
  workflow_call:
    inputs:
      pnpm-version:
        description: >-
          Which pnpm to install. Empty by default, so pnpm/action-setup resolves the
          version from the calling repository's package.json, where
          `devEngines.packageManager` names the range the Node toolchain policy allows.
          Pass an explicit version only to override that, and only from a repository
          whose manifest declares none — the action treats a version here plus a
          declaration there as a hard error. (RSRMID-3008)
        type: string
        required: false
        default: ""

jobs:
  lint:
    name: 🧪 Linting
    runs-on: ${{ vars.RTLDEV_MW_CI_OS }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: ${{ inputs.pnpm-version }}
      - name: Setup NodeJS ${{ vars.RTLDEV_MW_CI_NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.RTLDEV_MW_CI_NODE_VERSION }}
          check-latest: true
          cache: pnpm
      - name: Install NodeJS Dependencies
        run: pnpm i --frozen-lockfile
      - name: Linting
        run: pnpm run lint

  test:
    name: 🧪 Testing
    runs-on: ${{ vars.RTLDEV_MW_CI_OS }}
    needs: lint
    permissions:
      contents: read
    strategy:
      max-parallel: 1 # Run 1 job at a time to avoid timeouts
      matrix:
        node-version: ${{ fromJson(vars.RTLDEV_MW_CI_NODE_MATRIX) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: ${{ inputs.pnpm-version }}
      - name: Setup NodeJS ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: pnpm
      - name: Install NodeJS Dependencies
        run: pnpm i --frozen-lockfile
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable
        id: setup-chrome
      - name: Tests
        env:
          GITHUB_TOKEN: ${{ secrets.RTLDEV_MW_CI_TOKEN }}
          GITHUB_REPO: ${{ vars.GH_REPO }}
          WHMCSMP_LOGIN: ${{ secrets.WHMCSMP_LOGIN }}
          WHMCSMP_PASSWORD: ${{ secrets.WHMCSMP_PASSWORD }}
          WHMCSMP_PRODUCTID: ${{ vars.WHMCSMP_PRODUCTID }}
          WHMCSMP_MINVERSION: ${{ vars.WHMCSMP_MINVERSION }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          PUPPETEER_CHROME_SKIP_DOWNLOAD: 'true'
          PUPPETEER_CHROME_HEADLESS_SHELL_SKIP_DOWNLOAD: 'true'
          PUPPETEER_FIREFOX_SKIP_DOWNLOAD: 'true'
          PUPPETEER_KEEP_OPEN: 'true'
          DEBUG: ${{ vars.DEBUG }}
        run: pnpm test

  perform_codeql_analysis:
    name: 🧪 CodeQL Analysis
    runs-on: ${{ vars.RTLDEV_MW_CI_OS }}
    needs: test
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: ${{ inputs.pnpm-version }}
      - name: Setup NodeJS ${{ vars.RTLDEV_MW_CI_NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.RTLDEV_MW_CI_NODE_VERSION }}
          check-latest: true
          cache: pnpm
      - name: Install NodeJS Dependencies
        run: pnpm i --frozen-lockfile
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: javascript
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.9

  dependabot:
    needs:
      - perform_codeql_analysis
      - lint
      - test
    if: ${{ needs.lint.result == 'success' && needs.test.result == 'success' && needs.perform_codeql_analysis.result == 'success' }}
    uses: ./.github/workflows/auto-merge-dependabot-pr.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
