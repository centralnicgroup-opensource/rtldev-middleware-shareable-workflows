name: Linting & Coverage
on:
  workflow_call:
    inputs:
      pnpm-version:
        description: >-
          Which pnpm to install. The default installs whatever pnpm released most
          recently; pass "" to make the action resolve the version from the
          caller's package.json instead, where `devEngines.packageManager` names
          the range this policy allows. Passing a version here as well as
          declaring one there is a hard error in the action, so this input exists
          to let each repository move across on its own commit — once every caller
          passes "", the input and this default go away. (RSRMID-3008)
        type: string
        required: false
        default: latest

jobs:
  lint:
    name: 🧪 Linting
    runs-on: ${{ vars.RTLDEV_MW_CI_OS }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: ${{ inputs.pnpm-version }}
      - name: Setup NodeJS @ ${{ vars.RTLDEV_MW_CI_NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.RTLDEV_MW_CI_NODE_VERSION }}
          check-latest: true
          cache: pnpm
      - name: Install node dependencies
        run: pnpm i --frozen-lockfile
      - name: Linting
        run: pnpm run lint

  test_matrix:
    strategy:
      matrix:
        node-version:
          - ${{ vars.RTLDEV_MW_CI_NODE_VERSION }}

    name: 🧪 Testing
    runs-on: ${{ vars.RTLDEV_MW_CI_OS }}
    needs: lint
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: ${{ inputs.pnpm-version }}
      - name: Use NodeJS @ ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          check-latest: true
          cache: pnpm
      - name: Install dependencies
        run: pnpm i --frozen-lockfile
      - name: Run test
        run: pnpm run test --silent >/dev/null

  dependabot:
    needs:
      - test_matrix
      - lint
    if: ${{ needs.lint.result == 'success' && needs.test_matrix.result == 'success' }}
    uses: ./.github/workflows/auto-merge-dependabot-pr.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
