name: Linting & Coverage
on:
  workflow_call:

jobs:
  lint:
    name: 🧪 Linting
    runs-on: ${{ vars.RTLDEV_MW_CI_OS }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "${{ vars.RTLDEV_MW_CI_GOLANG_VERSION }}"
          check-latest: true
      - name: Run Go linter
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          # This pin is coupled to RTLDEV_MW_CI_GOLANG_VERSION above, and cannot be left
          # behind it. golangci-lint embeds the go/types type checker from the Go release
          # it was itself compiled against; when a source file it loads declares a newer
          # language version — the standard library of the toolchain setup-go just
          # installed is enough — the checker panics instead of reporting a diagnostic,
          # and the exit code 2 skips the Testing job with it. Raising that variable to a
          # new Go minor therefore needs a golangci-lint release built with that minor:
          # v2.13.0 added go1.27 support, where v2.12.2 was built with go1.26 and panicked
          # on the go1.27 standard library. (RSRMID-3071)
          version: v2.13.2
          args: --config .github/linters/.golangci.yml ./...
      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
      - name: Run shell linter
        run: |
          find . -name '*.sh' \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -not -path './rtldev-middleware-dnscontrol/*' \
            -print0 | xargs -0 --no-run-if-empty shellcheck

  test_matrix:
    name: 🧪 Testing
    runs-on: ${{ vars.RTLDEV_MW_CI_OS }}
    needs: lint
    strategy:
      matrix:
        go-version: ${{ fromJson(vars.RTLDEV_MW_CI_GOLANG_MATRIX) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: Run build
        run: go build ./... && go vet ./...
      - name: Running automated tests
        env:
          CNR_TEST_USER: ${{ secrets.RTLDEV_MW_CI_USER_CNR }}
          CNR_TEST_PASSWORD: ${{ secrets.RTLDEV_MW_CI_USERPASSWORD_CNR }}
        run: |
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -html=coverage.out -o coverage.html

  dependabot:
    needs:
      - test_matrix
      - lint
    if: ${{ needs.lint.result == 'success' && needs.test_matrix.result == 'success' }}
    uses: ./.github/workflows/auto-merge-dependabot-pr.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write