name: Daily Node dependency refresh

on:
  workflow_call:
    inputs:
      pnpm-version:
        description: >-
          Which pnpm to install. Empty by default, so pnpm/action-setup resolves the
          version from the calling repository's package.json, where
          `devEngines.packageManager` names the range the Node toolchain policy allows.
          Pass an explicit version only to override that, and only from a repository
          whose manifest declares none — the action treats a version here plus a
          declaration there as a hard error. (RSRMID-3008)
        type: string
        required: false
        default: ""
      base-ref:
        description: Branch to update and use as the pull request base. Defaults to the caller repository default branch.
        required: false
        type: string
      pull-request-branch:
        description: Branch name used for the dependency refresh pull request.
        required: false
        type: string
        default: automation/daily-node-dependency-refresh
      commit-message:
        description: Commit message for dependency refresh changes.
        required: false
        type: string
        default: "chore(deps): refresh node dependencies"
      pull-request-title:
        description: Pull request title for dependency refresh changes.
        required: false
        type: string
        default: "chore(deps): refresh node dependencies"
      pull-request-body:
        description: Pull request body for dependency refresh changes.
        required: false
        type: string
        default: |
          ## Summary
          - update package.json with npm-check-updates patch and minor releases
          - remove pnpm install state and regenerate pnpm-lock.yaml with pnpm update
          - allow the test workflow to enable auto-merge after checks pass

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base-ref || github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.RTLDEV_MW_CI_NODE_VERSION || '24' }}
          check-latest: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: ${{ inputs.pnpm-version }}

      # NEITHER COMMAND BELOW PASSES A RELEASE-AGE THRESHOLD, DELIBERATELY.
      #
      # This step used to resolve with `pnpm --config.minimumReleaseAge=30` — thirty
      # minutes — while every other install in every repository applied pnpm's default of
      # 24 hours. So the refresh committed lockfiles that every consumer then rejected
      # with ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION for up to a day, and any release
      # triggered in that window failed through no fault of the change that triggered it.
      # The offending packages rotated with each run, which made a standing conflict
      # between two jobs look like a transient. (RSRMID-3018)
      #
      # Correcting the number here would have left two thresholds for somebody to keep
      # equal. Instead both tools read the calling repository's own pnpm-workspace.yaml:
      # pnpm natively, and npm-check-updates via `--packageManager pnpm`, which consults
      # `minimumReleaseAge` when no `--cooldown` is given. That makes the producer and the
      # consumer of the lockfile the same threshold by construction — and since the
      # constraint is "published before now minus the threshold", and now only ever moves
      # forward, a lockfile this job resolves can never be too fresh for a later install.
      #
      # ncu needs the threshold as much as pnpm does: it rewrites the ranges in
      # package.json, so without it a range floor would be raised to a version pnpm is
      # then forbidden to install, and the refresh would fail on its own output.
      - name: Refresh package.json and pnpm lockfile
        run: |
          pnpm dlx npm-check-updates -u --packageManager pnpm --target minor --rejectVersion '/^(?:github:|git(?:\+|:)|file:|link:|workspace:|portal:|patch:|https?:|ssh:)/'
          rm -rf node_modules .pnpm-store
          rm -f pnpm-lock.yaml
          pnpm update --ignore-scripts

      - name: Create pull request
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.RTLDEV_MW_CI_TOKEN }}
          branch: ${{ inputs.pull-request-branch }}
          base: ${{ inputs.base-ref || github.event.repository.default_branch }}
          delete-branch: true
          commit-message: ${{ inputs.commit-message }}
          title: ${{ inputs.pull-request-title }}
          body: ${{ inputs.pull-request-body }}
