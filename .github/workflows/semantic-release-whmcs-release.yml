name: Release
on:
  workflow_call:
    inputs:
      pnpm-version:
        description: >-
          Which pnpm to install. The default installs whatever pnpm released most
          recently; pass "" to make the action resolve the version from the
          caller's package.json instead, where `devEngines.packageManager` names
          the range this policy allows. Passing a version here as well as
          declaring one there is a hard error in the action, so this input exists
          to let each repository move across on its own commit — once every caller
          passes "", the input and this default go away. (RSRMID-3008)
        type: string
        required: false
        default: latest

jobs:
  tests:
    # Forwarded, so the nested test job resolves pnpm the same way this one does —
    # otherwise a caller that resolves it from its manifest still gets `latest` here.
    uses: ./.github/workflows/semantic-release-whmcs-test.yml
    with:
      pnpm-version: ${{ inputs.pnpm-version }}
    secrets: inherit
    
  release:
    name: Release
    needs: tests
    runs-on: ${{ vars.RTLDEV_MW_CI_OS }}
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      deployments: write
      id-token: write # to enable use of OIDC for trusted publishing and npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: ${{ inputs.pnpm-version }}
      - name: Setup NodeJS ${{ vars.RTLDEV_MW_CI_NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: "${{ vars.RTLDEV_MW_CI_NODE_VERSION }}"
          check-latest: true
          cache: pnpm
      - name: Install NodeJS Dependencies
        run: pnpm i --frozen-lockfile
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.RTLDEV_MW_CI_TOKEN }}
          GITHUB_REPO: ${{ vars.GH_REPO }}
          NPM_TOKEN: ${{ secrets.RTLDEV_MW_CI_NPM_TOKEN }}
          TEAMS_NOTIFICATION_URI: ${{ secrets.RTLDEV_MW_CI_NOTIFICATION_URI }}
          COMMIT_SHA: ${{ github.sha }}
        run: pnpm exec semantic-release
