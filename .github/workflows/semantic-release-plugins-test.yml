name: Linting & Coverage
on:
  workflow_call:

jobs:
  tests:
    name: Test package
    runs-on: ${{ vars.RTLDEV_MW_CI_OS || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No version input, so the action resolves pnpm from the caller's
      # `devEngines.packageManager`. This replaces `corepack enable`, which Node stopped
      # bundling at v25 and which read the `packageManager` field the policy now
      # forbids. (RSRMID-3008)
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10

      - name: Setup NodeJS ${{ vars.RTLDEV_MW_CI_NODE_VERSION || '24' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ vars.RTLDEV_MW_CI_NODE_VERSION || '24' }}
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build package
        run: pnpm run build

      - name: Test package
        run: pnpm run test:coverage
        env:
          RTLDEV_MW_CI_USER_CNR: ${{ secrets.RTLDEV_MW_CI_USER_CNR }}
          RTLDEV_MW_CI_USERPASSWORD_CNR: ${{ secrets.RTLDEV_MW_CI_USERPASSWORD_CNR }}
          RTLDEV_MW_CI_ROLE_CNR: ${{ secrets.RTLDEV_MW_CI_ROLE_CNR }}
          RTLDEV_MW_CI_ROLEPASSWORD_CNR: ${{ secrets.RTLDEV_MW_CI_ROLEPASSWORD_CNR }}

      - name: Teams notification integration test
        env:
          TEAMS_NOTIFICATION_URI: ${{ secrets.TEAMS_NOTIFICATION_URI }}
        run: pnpm run test:teams

      # The whmcs-marketplace plugin drives the Marketplace listing forms in a
      # real browser, so the two tests below need one. This is the package's own
      # installer - the same one the plugin's prepare hook and the devcontainer
      # run - rather than a browser action, so that CI exercises the code path
      # that provisions the browser during a real release.
      - name: Install Chrome for the marketplace tests
        run: pnpm run browser:install

      # Needs a browser but no credentials, and publishes nothing: it checks the
      # vendored cookie extension really loads and that the live Marketplace
      # login form still has the selectors the plugin drives.
      - name: WHMCS Marketplace browser test
        env:
          # The browser flow is only observable through this log, and a failure
          # here is the first thing anyone will want to read.
          DEBUG: semantic-release:whmcs-marketplace
        run: pnpm run test:browser

      # Publishes a throwaway version to the product named by WHMCSMP_PRODUCTID
      # and removes it again, so that variable must point at a listing nobody
      # depends on. Skips itself when the credentials are not available.
      - name: WHMCS Marketplace integration test
        env:
          WHMCSMP_LOGIN: ${{ secrets.WHMCSMP_LOGIN }}
          WHMCSMP_PASSWORD: ${{ secrets.WHMCSMP_PASSWORD }}
          WHMCSMP_PRODUCTID: ${{ vars.WHMCSMP_PRODUCTID }}
          WHMCSMP_MINVERSION: ${{ vars.WHMCSMP_MINVERSION }}
          WHMCSMP_TEST_PRODUCTID: ${{ vars.WHMCSMP_TEST_PRODUCTID }}
          DEBUG: semantic-release:whmcs-marketplace
        run: pnpm run test:whmcs

      - name: Lint package
        run: pnpm run lint

  dependabot:
    needs:
      - tests
    if: ${{ needs.tests.result == 'success' }}
    uses: ./.github/workflows/auto-merge-dependabot-pr.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
